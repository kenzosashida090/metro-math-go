services:
  db:
    image: pgvector/pgvector:pg16
    container_name: metromath-db-ps
    environment:
        POSTGRES_DB: ${POSTGRES_DB}
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgressql/data
    ports:
      - "${DB_PORT}:${DB_PORT}"

volumes:
  db-data:
