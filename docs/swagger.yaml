      name:
        maxLength: 80
        minLength: 1
        type: string
      sections:
        items:
          $ref: '#/definitions/main.SectionPayload'
        maxItems: 50
        minItems: 1
        type: array
    type: object
  store.Section:
    properties:
      bars:
        type: integer
      groups:
        items:
          type: integer
        type: array
    type: object
  store.Song:
    properties:
